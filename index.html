<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nihongo</title>
<!-- The app lives in app/. GitHub Pages' "Deploy from a branch" option serves
     the repository root, so this sends visitors one level down. If Pages is
     instead set to "GitHub Actions", the workflow uploads app/ as the site
     root and this file is never published — either configuration works. -->
<meta http-equiv="refresh" content="0; url=./app/">
<link rel="canonical" href="./app/">
<script>location.replace('./app/' + location.hash);</script>
<style>
  html { color-scheme: dark light; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-content: center;
    gap: 12px; justify-items: center; background: #0e1116; color: #9aa8b8;
    font-family: system-ui, sans-serif; text-align: center; padding: 24px;
  }
  a { color: #ff5a5f; font-weight: 600; }
  .mark { font-size: 56px; color: #ff5a5f; }
</style>
</head>
<body>
  <div class="mark" lang="ja">語</div>
  <p>Opening Nihongo…</p>
  <p><a href="./app/">Continue to the app</a></p>
</body>
</html>
